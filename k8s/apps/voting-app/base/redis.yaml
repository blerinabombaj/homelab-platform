# "---" separates several objects in one file.
# ---------- Deployment: "keep N copies of this pod running" ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis                      # labels = tags used to find/select objects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis                    # "this Deployment owns pods with label app=redis"
  template:                         # the pod blueprint
    metadata:
      labels:
        app: redis                  # must match the selector above
    spec:
      securityContext:              # pod-level: applies to all containers
        runAsNonRoot: true          # refuse to start if the image would run as root
        runAsUser: 999              # "redis" user in the official image
        seccompProfile:
          type: RuntimeDefault      # block dangerous Linux syscalls (the container runtime's default filter)
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - name: redis
              containerPort: 6379
          securityContext:          # container-level hardening
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]         # remove all Linux capabilities, none are needed
          # readinessProbe: "may this pod receive traffic?" -> no = removed from the Service.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          # livenessProbe: "is it stuck?" -> no = kubelet restarts the container.
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          # requests = guaranteed share, used by the scheduler to place the pod.
          # limits   = hard cap. Over memory limit -> OOMKilled. Over CPU -> throttled.
          resources:
            requests: { cpu: 25m, memory: 32Mi }   # 25m = 2.5% of one CPU core
            limits:   { memory: 128Mi }            # no CPU limit on purpose: throttling hurts more than it helps
---
# ---------- Service: a stable name + IP in front of changing pods ----------
# Pods get new IPs every restart. The Service "redis" always resolves (DNS) to the
# healthy pods matching its selector, so apps just connect to "redis:6379".
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379          # port the Service listens on
      targetPort: redis   # container port (by name), forwarded to
