# GitHub Actions: runs on GitHub's servers on every push / pull request.
# Goal for this repo: catch broken Terraform, Dockerfiles and Kubernetes YAML BEFORE Argo CD
# tries to apply them. (Image publishing comes from petclinic-delivery's pipeline pattern.)
name: ci

# WHEN it runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow's GITHUB_TOKEN can only read the repo.
permissions:
  contents: read

# A new push to the same branch cancels the still-running older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job 1: Terraform formatting + validation ----
  terraform:
    runs-on: ubuntu-latest           # a fresh VM for every run
    strategy:
      matrix:                        # run this job once per folder, in parallel
        dir: [terraform/00-docker, terraform/10-cluster]
    steps:
      - uses: actions/checkout@v5    # get the repo code onto the VM
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive    # fails if files aren't formatted (`terraform fmt` fixes)
        working-directory: ${{ matrix.dir }}
      - name: validate
        # -backend=false: download providers but don't touch any state. validate = syntax + types.
        run: terraform init -backend=false && terraform validate
        working-directory: ${{ matrix.dir }}

  # ---- Job 2: Dockerfile linting ----
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker, seed-data]
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0   # checks Dockerfile best practices (pinning, apt cleanup...)
        with:
          dockerfile: app/${{ matrix.service }}/Dockerfile
          failure-threshold: error             # warnings are shown but don't fail the build

  # ---- Job 3: Kubernetes manifests ----
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests
        # kubectl kustomize renders the overlay into plain YAML; kubeconform checks it against
        # the Kubernetes API schemas. The second schema location covers CRDs (HTTPRoute, Gateway, Application).
        run: |
          for dir in k8s/apps/voting-app/overlays/dev k8s/platform/gateway; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas
          done

  # ---- Job 4: images actually build ----
  build:
    runs-on: ubuntu-latest
    needs: [hadolint]                # only build if the Dockerfiles passed linting
    env:
      # compose.yaml requires these (":?"), even just to build. Dummy values, CI never runs the DB.
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
